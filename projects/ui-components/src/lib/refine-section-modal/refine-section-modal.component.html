<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60">
  <div class="bg-white rounded border border-slate-200 shadow-2xl w-full max-w-xl overflow-hidden">
    <div class="px-5 py-3.5 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <lucide-icon [img]="Sparkles" class="w-4 h-4 text-teal-700"></lucide-icon>
        <h3 class="text-sm font-bold text-slate-900">Refine Section: {{ sectionTitle }}</h3>
      </div>
      <button (click)="closeModal.emit()" class="p-1 rounded text-slate-400 hover:text-slate-700 cursor-pointer">
        <lucide-icon [img]="X" class="w-4 h-4"></lucide-icon>
      </button>
    </div>
    <div class="p-5 space-y-4 text-xs text-slate-800">
      <div>
        <label class="block font-semibold text-slate-700 mb-1.5">Quick Clinical Adjustments:</label>
        <div class="flex flex-wrap gap-1.5">
          <button *ngFor="let prompt of quickPrompts" (click)="instruction = prompt; handleRefine(prompt)"
            class="text-[11px] px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200 cursor-pointer font-medium text-left">
            {{ prompt }}
          </button>
        </div>
      </div>
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Custom Directive for Medical Scribe:</label>
        <div class="flex gap-2">
          <input type="text" [(ngModel)]="instruction" placeholder="e.g., Emphasize Canadian Cardiovascular Society (CCS) angina class..."
            class="flex-1 text-xs p-2 bg-white border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-teal-600"
            (keydown.enter)="handleRefine()">
          <button (click)="handleRefine()" [disabled]="isProcessing || !instruction.trim()"
            class="px-3 py-2 rounded bg-slate-900 hover:bg-slate-800 text-white font-medium disabled:opacity-50 cursor-pointer flex items-center gap-1 shrink-0">
            <lucide-icon [img]="isProcessing ? RefreshCw : Sparkles" [ngClass]="isProcessing ? 'animate-spin' : ''" class="w-3.5 h-3.5"></lucide-icon>
            <span>Apply</span>
          </button>
        </div>
      </div>
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Preview &amp; Edit Revised Text:</label>
        <textarea rows="6" [(ngModel)]="refinedText"
          class="w-full text-xs p-2.5 bg-white border border-slate-300 rounded text-slate-900 leading-relaxed focus:outline-none focus:ring-1 focus:ring-teal-600 font-mono text-[11px]"></textarea>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-200">
        <button (click)="closeModal.emit()" class="px-3 py-1.5 rounded border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium cursor-pointer">Cancel</button>
        <button (click)="handleSave()" class="px-4 py-1.5 rounded bg-teal-700 hover:bg-teal-800 text-white font-semibold flex items-center gap-1.5 cursor-pointer shadow-xs">
          <lucide-icon [img]="Check" class="w-3.5 h-3.5"></lucide-icon>
          <span>Apply to Clinical Note</span>
        </button>
      </div>
    </div>
  </div>
</div>
