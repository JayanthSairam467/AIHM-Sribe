<header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between sticky top-0 z-30 shadow-xs">
  <div class="flex items-center gap-3">
    <!-- ScribeOS Logo -->
    <div class="flex items-center">
      <div class="w-7 h-7 bg-slate-900 rounded-[6px] flex items-center justify-center mr-2.5 shadow-sm">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      </div>
      <span class="font-bold text-base tracking-tight text-slate-900">Scribe<span class="font-normal text-slate-500">OS</span></span>
    </div>

    <div class="h-6 w-px bg-slate-200 hidden md:block mx-2"></div>

    <!-- EHR Interoperability Badges -->
    <div class="hidden lg:flex items-center gap-2">
      <span class="inline-flex items-center gap-1 text-[11px] font-medium text-slate-700 bg-slate-50 border border-slate-200 px-2 py-0.5 rounded">
        <lucide-icon [img]="Wifi" class="w-3 h-3 text-teal-600"></lucide-icon>
        OpenAPI Gateway: Online
      </span>
      <span class="inline-flex items-center gap-1 text-[11px] font-medium text-slate-700 bg-slate-50 border border-slate-200 px-2 py-0.5 rounded">
        <lucide-icon [img]="ShieldCheck" class="w-3 h-3 text-emerald-600"></lucide-icon>
        FHIR R4 Interop: Ready
      </span>
    </div>
  </div>

  <div class="flex items-center gap-2.5">
    <!-- Attending Physician Badge -->
    <div class="hidden sm:flex items-center gap-2 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded text-xs">
      <lucide-icon [img]="UserCheck" class="w-3.5 h-3.5 text-slate-700"></lucide-icon>
      <div>
        <span class="font-semibold text-slate-900">Dr. Sarah Chen, MD</span>
        <span class="text-slate-700 text-[10px] ml-1.5">Cardiology / Internal Med</span>
      </div>
    </div>

    <!-- Note Status Indicator -->
    <span *ngIf="isSigned" class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded bg-emerald-50 text-emerald-800 border border-emerald-200">
      <lucide-icon [img]="CheckCircle2" class="w-3.5 h-3.5 text-emerald-600"></lucide-icon>
      <span class="hidden md:inline">Attested & Signed</span>
    </span>

    <span *ngIf="!isSigned" class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded bg-amber-50 text-amber-800 border border-amber-200">
      <lucide-icon [img]="Activity" class="w-3.5 h-3.5 text-amber-600 animate-pulse"></lucide-icon>
      <span>Active Encounter</span>
    </span>

    <!-- Architectural Specs Button -->
    <button
      id="btn-open-arch-spec"
      (click)="openArchitectureSpec.emit()"
      class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 transition-colors cursor-pointer"
      title="Inspect Healthcare IT Angular Architecture, Design System Tokens, and User Flow"
    >
      <lucide-icon [img]="FileCode2" class="w-3.5 h-3.5 text-slate-700"></lucide-icon>
      <span class="hidden sm:inline">Design System & Architecture</span>
      <span class="sm:hidden">Spec</span>
    </button>

    <div class="h-6 w-px bg-slate-200 hidden md:block mx-1"></div>

    <button (click)="logout.emit()" class="text-[10px] uppercase font-bold text-slate-400 hover:text-slate-700 tracking-wider transition-colors cursor-pointer px-2" title="Log out">
       LOGOUT
    </button>
  </div>
</header>
