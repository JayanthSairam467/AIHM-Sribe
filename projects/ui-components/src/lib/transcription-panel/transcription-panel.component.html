<div class="absolute inset-0 flex flex-col bg-white z-0">
  <!-- Header -->
  <div class="px-4 py-2 flex items-center justify-between border-b border-slate-100 bg-slate-50/50 shrink-0">
    <div class="flex items-center gap-2">
       <button (click)="setViewFilter('all')" [ngClass]="viewFilter === 'all' ? 'bg-slate-200 text-slate-800 shadow-sm' : 'text-slate-500 hover:bg-slate-100'" class="px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-wider transition-colors cursor-pointer">All</button>
       <button (click)="setViewFilter('doctor')" [ngClass]="viewFilter === 'doctor' ? 'bg-slate-200 text-slate-800 shadow-sm' : 'text-slate-500 hover:bg-slate-100'" class="px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-wider transition-colors cursor-pointer">Dr.</button>
       <button (click)="setViewFilter('patient')" [ngClass]="viewFilter === 'patient' ? 'bg-slate-200 text-slate-800 shadow-sm' : 'text-slate-500 hover:bg-slate-100'" class="px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-wider transition-colors cursor-pointer">Pt.</button>
       <div class="w-px h-3.5 bg-slate-200 mx-1"></div>
       <button (click)="setViewFilter('flags')" [ngClass]="viewFilter === 'flags' ? 'bg-slate-200 text-amber-700 shadow-sm' : 'text-slate-400 hover:bg-slate-100 hover:text-amber-600'" class="p-1 rounded transition-colors cursor-pointer" title="Flagged items">
         <lucide-icon [img]="Flag" class="w-3.5 h-3.5"></lucide-icon>
       </button>
       <button (click)="setViewFilter('notes')" [ngClass]="viewFilter === 'notes' ? 'bg-slate-200 text-blue-700 shadow-sm' : 'text-slate-400 hover:bg-slate-100 hover:text-blue-600'" class="p-1 rounded transition-colors cursor-pointer" title="Private notes">
         <lucide-icon [img]="MessageSquarePlus" class="w-3.5 h-3.5"></lucide-icon>
       </button>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="px-4 py-2 border-b border-slate-100 shrink-0">
     <div class="relative">
       <lucide-icon [img]="Search" class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"></lucide-icon>
       <input type="text" [(ngModel)]="searchQuery" placeholder="Search conversation or notes..." class="w-full bg-slate-50 border-none rounded-md pl-8 pr-3 py-1.5 text-xs text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-1 focus:ring-slate-300">
     </div>
  </div>

  <!-- Utterance Stream -->
  <div #scrollContainer (scroll)="onScroll($event)" class="flex-1 overflow-y-auto px-5 py-4 relative scroll-smooth h-0">
     <!-- Auto-scroll indicator -->
     <button *ngIf="!autoScroll" (click)="scrollToBottom()" class="absolute bottom-4 right-1/2 translate-x-1/2 bg-slate-800/80 backdrop-blur-sm text-white px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider shadow-lg flex items-center gap-1.5 cursor-pointer z-30 transition-all hover:bg-slate-900">
        <lucide-icon [img]="ArrowDownCircle" class="w-3.5 h-3.5"></lucide-icon> Scroll to newest
     </button>

     <!-- Blank State -->
     <div *ngIf="filteredUtterances.length === 0" class="h-full flex flex-col items-center justify-center text-center opacity-60">
        <lucide-icon [img]="Radio" class="w-8 h-8 text-slate-300 mb-3"></lucide-icon>
        <p class="text-sm font-medium text-slate-500">No matching turns found</p>
        <p class="text-xs text-slate-400 mt-1">Try adjusting your filters</p>
     </div>

     <!-- Transcript Items -->
     <div *ngFor="let turn of filteredUtterances" class="mb-6 group relative">
       
        <!-- Private Note Item -->
        <ng-container *ngIf="turn.isNote; else transcriptItem">
           <div class="bg-blue-50/50 border border-blue-100 rounded-lg p-3 ml-8 relative shadow-sm">
             <div class="absolute -left-3 -top-2 w-6 h-6 bg-blue-100 rounded-full flex items-center justify-center border-2 border-white shadow-sm">
               <lucide-icon [img]="MessageSquarePlus" class="w-3 h-3 text-blue-600"></lucide-icon>
             </div>
             <p class="text-xs text-slate-700 italic">{{ turn.text }}</p>
             <span class="text-[9px] text-slate-400 mt-1 block">{{ turn.timestamp }}</span>
           </div>
        </ng-container>

        <!-- Standard Transcript Item -->
        <ng-template #transcriptItem>
           <div class="flex items-start gap-3 relative">
             <!-- Hover Actions -->
             <div class="absolute -right-2 top-0 opacity-0 group-hover:opacity-100 transition-opacity flex bg-white border border-slate-200 rounded shadow-sm z-10">
               <button (click)="handleCopy(turn)" class="p-1 hover:bg-slate-50 text-slate-400 hover:text-slate-700 transition-colors cursor-pointer" title="Copy text">
                 <lucide-icon [img]="copiedId === turn.id ? Check : Copy" [ngClass]="copiedId === turn.id ? 'text-emerald-500' : ''" class="w-3 h-3"></lucide-icon>
               </button>
               <div class="w-px bg-slate-200"></div>
               <button (click)="toggleFlag(turn)" class="p-1 hover:bg-slate-50 transition-colors cursor-pointer" [ngClass]="turn.isFlagged ? 'text-amber-500' : 'text-slate-400 hover:text-amber-500'" title="Flag for review">
                 <lucide-icon [img]="Flag" class="w-3 h-3" [class.fill-current]="turn.isFlagged"></lucide-icon>
               </button>
             </div>

             <!-- Avatar -->
             <div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 border border-slate-200 mt-0.5"
                  [ngClass]="turn.speaker === 'doctor' ? 'bg-blue-50 text-blue-600' : 'bg-slate-50 text-slate-400'">
                <lucide-icon *ngIf="turn.speaker === 'doctor'" [img]="Stethoscope" class="w-3 h-3"></lucide-icon>
                <lucide-icon *ngIf="turn.speaker === 'patient'" [img]="User" class="w-3 h-3"></lucide-icon>
             </div>
             
             <!-- Content -->
             <div class="flex-1 min-w-0">
               <div class="flex items-center gap-2 mb-1.5">
                  <span class="text-[10px] font-bold text-slate-700">{{ turn.speakerName }}</span>
                  <span class="text-[9px] font-mono text-slate-400">{{ turn.timestamp }}</span>
                  <lucide-icon *ngIf="turn.isFlagged" [img]="Flag" class="w-3 h-3 text-amber-500 fill-current"></lucide-icon>
               </div>
               
               <p class="text-[13px] leading-relaxed text-slate-600" [ngClass]="turn.isFlagged ? 'bg-amber-50 rounded px-1 -mx-1' : ''">
                  <span [class.font-medium]="turn.speaker === 'doctor'" [class.text-slate-800]="turn.speaker === 'doctor'">{{ turn.text }}</span>
               </p>
             </div>
           </div>
        </ng-template>
     </div>
     
     <!-- Streaming indicator -->
     <div *ngIf="isStreaming" class="flex items-center gap-3 opacity-50 ml-9 mt-4">
       <div class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
       <div class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
       <div class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
     </div>
  </div>

  <!-- Doctor Scratchpad -->
  <div class="shrink-0 p-3 bg-slate-50 border-t border-slate-200 relative z-20 shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
     <div class="relative flex items-center">
        <textarea [(ngModel)]="scratchpadText" 
                  (keydown.enter)="$event.preventDefault(); submitNote()"
                  placeholder="Type a private note (press Enter)..." 
                  class="w-full bg-white border border-slate-200 rounded-lg pl-3 pr-10 py-2.5 text-xs text-slate-700 placeholder:text-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none h-[42px] overflow-hidden"></textarea>
        <button (click)="submitNote()" [disabled]="!scratchpadText.trim()" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center bg-blue-50 text-blue-600 rounded-md hover:bg-blue-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
           <lucide-icon [img]="MessageSquarePlus" class="w-3.5 h-3.5"></lucide-icon>
        </button>
     </div>
  </div>
  
  <div class="h-7 shrink-0 bg-slate-100 flex items-center justify-between px-4 border-t border-slate-200">
     <div class="flex items-center gap-2 text-[9px] text-slate-500 font-medium">
        <lucide-icon [img]="Volume2" class="w-3 h-3"></lucide-icon>
        {{ utterances.length }} interactions logged
     </div>
     <div class="flex items-center gap-1.5 text-[9px] text-emerald-600 font-bold uppercase tracking-wider">
        <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full shadow-[0_0_5px_rgba(16,185,129,0.5)]"></div>
        Stream Active
     </div>
  </div>
</div>
